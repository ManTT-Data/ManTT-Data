<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="100%" height="215">
  
    <defs>
      <!-- Cyberpunk Grid -->
      <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.04" />
      </pattern>

      <!-- Finer Grid -->
      <pattern id="cyber-grid-dense" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.025" />
      </pattern>

      <!-- Diagonal Scanlines -->
      <pattern id="cyber-scanlines" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.03" />
      </pattern>

      <!-- Glow Filters -->
      <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-cyan-subtle" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Background Gradients -->
      <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a101d" />
        <stop offset="50%" stop-color="#070b13" />
        <stop offset="100%" stop-color="#05080f" />
      </linearGradient>

      <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0e1728" />
        <stop offset="100%" stop-color="#080e1a" />
      </linearGradient>

      <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
        <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
      </linearGradient>

      <linearGradient id="accent-cyan-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#ff007f" />
      </linearGradient>
    </defs>
    
  
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
      .cursor-blink { animation: blink 1.1s infinite; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cyber-hover { transition: all 0.3s ease; }
      .cyber-hover:hover { stroke: #00f0ff; stroke-width: 1.5; filter: url(#glow-cyan); }
    </style>
    

  <!-- Main Terminal Frame -->
  <path d="M 1 1 L 885 1 L 899 15 L 899 214 L 1 214 Z" fill="#070b12" stroke="#00f0ff" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="211" fill="url(#cyber-grid)" />

  <!-- Terminal Chrome Top Bar -->
  
      <!-- Terminal Top Chrome -->
      <path d="M 1 1 L 891 1 L 899 9 L 899 33 L 1 33 Z" fill="#0f192b" stroke="#172b45" stroke-width="1" />
      
      <!-- Traffic lights -->
      <circle cx="17" cy="17" r="4" fill="#ff4d4d" opacity="0.85" />
      <circle cx="29" cy="17" r="4" fill="#ffb830" opacity="0.85" />
      <circle cx="41" cy="17" r="4" fill="#00f0ff" opacity="0.85" />

      <!-- Path / Title -->
      <text x="59" y="21" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.5">~/metrics</text>
      
      <!-- Right Security/Status Tag -->
      <text x="881" y="21" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">// SEC_02: TELEMETRY</text>
      
      <!-- Bottom separator line -->
      <line x1="1" y1="33" x2="899" y2="33" stroke="#172b45" stroke-width="1" />
    

  <!-- Terminal Command Line -->
  <g transform="translate(24, 56)">
    
      <text x="0" y="0" fill="#ff007f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">$</text>
      <text x="16" y="0" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.5">sys_stat --github-telemetry @ManTT-Data</text>
      <rect x="330" y="-11" width="7" height="13" fill="#00f0ff" class="cursor-blink" />
    
  </g>

  <!-- Metric Cards Grid -->
  
        <!-- Card 1 -->
        <g>
          <path d="M 22 74 L 216 74 L 224 82 L 224 192 L 22 192 Z" fill="#0a1220" stroke="#172b45" stroke-width="1" />
          <line x1="22" y1="76" x2="58" y2="76" stroke="#00f0ff" stroke-width="2" />
          
          <!-- Tag Header -->
          <text x="36" y="94" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.5">COMMITS // VOL</text>
          
          <!-- Primary Metric Value -->
          <text x="36" y="126" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="900" letter-spacing="1">1,420+</text>
          
          <!-- Subtitle -->
          <text x="36" y="144" fill="#009bb3" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.5">CODE COMMITS</text>

          <!-- Gauge Progress Bar -->
          <rect x="36" y="156" width="174" height="4" rx="2" fill="#142338" />
          <rect x="36" y="156" width="153.12" height="4" rx="2" fill="#00f0ff" />

          <!-- Bottom Telemetry Status -->
          <circle cx="39" cy="176" r="3" fill="#00f0ff" />
          <text x="48" y="179" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">VELOCITY: HIGH</text>
        </g>
        

        <!-- Card 2 -->
        <g>
          <path d="M 238 74 L 432 74 L 440 82 L 440 192 L 238 192 Z" fill="#0a1220" stroke="#172b45" stroke-width="1" />
          <line x1="238" y1="76" x2="274" y2="76" stroke="#00ff9f" stroke-width="2" />
          
          <!-- Tag Header -->
          <text x="252" y="94" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.5">PULL_REQS // MERGE</text>
          
          <!-- Primary Metric Value -->
          <text x="252" y="126" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="900" letter-spacing="1">52+</text>
          
          <!-- Subtitle -->
          <text x="252" y="144" fill="#009bb3" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.5">MERGED WORKFLOWS</text>

          <!-- Gauge Progress Bar -->
          <rect x="252" y="156" width="174" height="4" rx="2" fill="#142338" />
          <rect x="252" y="156" width="165.29999999999998" height="4" rx="2" fill="#00ff9f" />

          <!-- Bottom Telemetry Status -->
          <circle cx="255" cy="176" r="3" fill="#00ff9f" />
          <text x="264" y="179" fill="#00ff9f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">CI/CD: 100% GREEN</text>
        </g>
        

        <!-- Card 3 -->
        <g>
          <path d="M 454 74 L 648 74 L 656 82 L 656 192 L 454 192 Z" fill="#0a1220" stroke="#172b45" stroke-width="1" />
          <line x1="454" y1="76" x2="490" y2="76" stroke="#ffe600" stroke-width="2" />
          
          <!-- Tag Header -->
          <text x="468" y="94" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.5">STREAK // UPTIME</text>
          
          <!-- Primary Metric Value -->
          <text x="468" y="126" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="900" letter-spacing="1">42 DAYS</text>
          
          <!-- Subtitle -->
          <text x="468" y="144" fill="#009bb3" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.5">CONCURRENT CYCLE</text>

          <!-- Gauge Progress Bar -->
          <rect x="468" y="156" width="174" height="4" rx="2" fill="#142338" />
          <rect x="468" y="156" width="142.67999999999998" height="4" rx="2" fill="#ffe600" />

          <!-- Bottom Telemetry Status -->
          <circle cx="471" cy="176" r="3" fill="#ffe600" />
          <text x="480" y="179" fill="#ffe600" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">STABILITY: OPTIMAL</text>
        </g>
        

        <!-- Card 4 -->
        <g>
          <path d="M 670 74 L 864 74 L 872 82 L 872 192 L 670 192 Z" fill="#0a1220" stroke="#172b45" stroke-width="1" />
          <line x1="670" y1="76" x2="706" y2="76" stroke="#ff007f" stroke-width="2" />
          
          <!-- Tag Header -->
          <text x="684" y="94" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="0.5">SECURITY // CODE</text>
          
          <!-- Primary Metric Value -->
          <text x="684" y="126" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="900" letter-spacing="1">S-TIER</text>
          
          <!-- Subtitle -->
          <text x="684" y="144" fill="#009bb3" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="0.5">CODE INTEGRITY</text>

          <!-- Gauge Progress Bar -->
          <rect x="684" y="156" width="174" height="4" rx="2" fill="#142338" />
          <rect x="684" y="156" width="170.52" height="4" rx="2" fill="#ff007f" />

          <!-- Bottom Telemetry Status -->
          <circle cx="687" cy="176" r="3" fill="#ff007f" />
          <text x="696" y="179" fill="#ff007f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" letter-spacing="0.5">0 DEFECTS / SEC_OK</text>
        </g>
        

  <!-- Bottom Terminal Status Bar -->
  <line x1="22" y1="205" x2="878" y2="205" stroke="#172b45" stroke-width="0.5" />
</svg>