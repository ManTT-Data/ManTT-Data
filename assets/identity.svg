<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 185" width="100%" height="185">
  
    <defs>
      <!-- Cyberpunk Grid -->
      <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.04" />
      </pattern>

      <!-- Finer Grid -->
      <pattern id="cyber-grid-dense" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.025" />
      </pattern>

      <!-- Diagonal Scanlines -->
      <pattern id="cyber-scanlines" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.03" />
      </pattern>

      <!-- Glow Filters -->
      <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-cyan-subtle" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Background Gradients -->
      <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a101d" />
        <stop offset="50%" stop-color="#070b13" />
        <stop offset="100%" stop-color="#05080f" />
      </linearGradient>

      <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0e1728" />
        <stop offset="100%" stop-color="#080e1a" />
      </linearGradient>

      <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
        <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
      </linearGradient>

      <linearGradient id="accent-cyan-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#ff007f" />
      </linearGradient>
    </defs>
    
  
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
      .cursor-blink { animation: blink 1.1s infinite; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cyber-hover { transition: all 0.3s ease; }
      .cyber-hover:hover { stroke: #00f0ff; stroke-width: 1.5; filter: url(#glow-cyan); }
    </style>
    

  <!-- Terminal Frame -->
  <path d="M 1 1 L 885 1 L 899 15 L 899 184 L 1 184 Z" fill="#070b12" stroke="#00f0ff" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="181" fill="url(#cyber-grid)" />

  <!-- Terminal Chrome Top Bar -->
  
      <!-- Terminal Top Chrome -->
      <path d="M 1 1 L 891 1 L 899 9 L 899 33 L 1 33 Z" fill="#0f192b" stroke="#172b45" stroke-width="1" />
      
      <!-- Traffic lights -->
      <circle cx="17" cy="17" r="4" fill="#ff4d4d" opacity="0.85" />
      <circle cx="29" cy="17" r="4" fill="#ffb830" opacity="0.85" />
      <circle cx="41" cy="17" r="4" fill="#00f0ff" opacity="0.85" />

      <!-- Path / Title -->
      <text x="59" y="21" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.5">~/identity</text>
      
      <!-- Right Security/Status Tag -->
      <text x="881" y="21" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">// SEC_01: WHOAMI</text>
      
      <!-- Bottom separator line -->
      <line x1="1" y1="33" x2="899" y2="33" stroke="#172b45" stroke-width="1" />
    

  <!-- Terminal Command Line -->
  <g transform="translate(24, 60)">
    
      <text x="0" y="0" fill="#ff007f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">$</text>
      <text x="16" y="0" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.5">whoami --verbose</text>
      <rect x="146" y="-11" width="7" height="13" fill="#00f0ff" class="cursor-blink" />
    
  </g>

  <!-- Dossier / Bio Content -->
  <g transform="translate(24, 88)">
    <text x="0" y="0" fill="#00ff9f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">&gt;&gt; IDENTITY VERIFIED:</text>
    <text x="160" y="0" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">Software Engineer</text>
    <text x="320" y="0" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12">//</text>
    <text x="340" y="0" fill="#c4dbeb" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12" font-style="italic">"Building, learning and experimenting with software."</text>

    <!-- Subtitle Interests Tag -->
    <text x="0" y="32" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">CORE SPECIALIZATIONS &amp; DOMAINS:</text>
  </g>

  <!-- Chips row -->
  
          <path d="M 24 138 L 214.0 138 L 220.0 144 L 220.0 164 L 24 164 Z" fill="#0e172a" stroke="#009bb3" stroke-width="1" />
          <text x="36" y="155" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">#SoftwareEngineering</text>
        

          <path d="M 232.0 138 L 379.5 138 L 385.5 144 L 385.5 164 L 232.0 164 Z" fill="#0e172a" stroke="#009bb3" stroke-width="1" />
          <text x="244.0" y="155" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">#BackendSystems</text>
        

          <path d="M 397.5 138 L 468.5 138 L 474.5 144 L 474.5 164 L 397.5 164 Z" fill="#0e172a" stroke="#009bb3" stroke-width="1" />
          <text x="409.5" y="155" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">#Cloud</text>
        

          <path d="M 486.5 138 L 600.0 138 L 606.0 144 L 606.0 164 L 486.5 164 Z" fill="#0e172a" stroke="#009bb3" stroke-width="1" />
          <text x="498.5" y="155" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">#Automation</text>
        

          <path d="M 618.0 138 L 731.5 138 L 737.5 144 L 737.5 164 L 618.0 164 Z" fill="#0e172a" stroke="#009bb3" stroke-width="1" />
          <text x="630.0" y="155" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">#OpenSource</text>
        

  <!-- Bottom Right Hex Stamp -->
  <text x="876" y="171" fill="#3d546b" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" text-anchor="end">SYS_UID: 0x902F // AUTH: VALID</text>
</svg>