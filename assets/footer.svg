<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 95" width="100%" height="95">
  
    <defs>
      <!-- Cyberpunk Grid -->
      <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.04" />
      </pattern>

      <!-- Finer Grid -->
      <pattern id="cyber-grid-dense" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.025" />
      </pattern>

      <!-- Diagonal Scanlines -->
      <pattern id="cyber-scanlines" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.03" />
      </pattern>

      <!-- Glow Filters -->
      <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-cyan-subtle" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Background Gradients -->
      <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a101d" />
        <stop offset="50%" stop-color="#070b13" />
        <stop offset="100%" stop-color="#05080f" />
      </linearGradient>

      <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0e1728" />
        <stop offset="100%" stop-color="#080e1a" />
      </linearGradient>

      <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
        <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
      </linearGradient>

      <linearGradient id="accent-cyan-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#ff007f" />
      </linearGradient>
    </defs>
    
  
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
      .cursor-blink { animation: blink 1.1s infinite; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cyber-hover { transition: all 0.3s ease; }
      .cyber-hover:hover { stroke: #00f0ff; stroke-width: 1.5; filter: url(#glow-cyan); }
    </style>
    

  <!-- Main Terminal Base -->
  <path d="M 1 13 L 13 1 L 887 1 L 899 13 L 899 82 L 887 94 L 13 94 L 1 82 Z" fill="#070b12" stroke="#00f0ff" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="91" fill="url(#cyber-grid)" />

  <!-- Top Line Accent -->
  <line x1="24" y1="2" x2="160" y2="2" stroke="#00f0ff" stroke-width="2" filter="url(#glow-cyan-subtle)" />

  <!-- Content -->
  <g transform="translate(24, 28)">
    <text x="0" y="0" fill="#ff007f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">[EOF]</text>
    <text x="45" y="0" fill="#c4dbeb" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600">// TERMINAL SESSION COMPLETE // CYBER_PROFILE v4.2</text>
    <text x="852" y="0" fill="#00ff9f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">[ STATUS: ALL SYSTEMS NOMINAL ]</text>
  </g>

  <!-- Security Hash and Cyber Identity -->
  <g transform="translate(24, 52)">
    <text x="0" y="0" fill="#3d546b" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600">HASH_ID: SHA256(7F83B1657FF1FC53B92DC18148A1D65DFC2D4B1FA3D677284ADDD200126D9069)</text>
    <text x="852" y="0" fill="#009bb3" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" text-anchor="end">SIGNAL: ENCRYPTED // NODE: PERSISTENT</text>
  </g>

  <!-- Bottom Accent -->
  <g transform="translate(24, 76)">
    <text x="0" y="0" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600">&#169; 2026 TEMAZZ // MAN TT &#8212; CYBERNETIC DEVELOPER PORTFOLIO</text>
    <text x="852" y="0" fill="#3d546b" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9" text-anchor="end">&lt;/SESSION_CLOSED&gt;</text>
  </g>
</svg>