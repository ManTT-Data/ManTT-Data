<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 215" width="100%" height="215">
  
    <defs>
      <!-- Cyberpunk Grid -->
      <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.04" />
      </pattern>

      <!-- Finer Grid -->
      <pattern id="cyber-grid-dense" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.025" />
      </pattern>

      <!-- Diagonal Scanlines -->
      <pattern id="cyber-scanlines" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.03" />
      </pattern>

      <!-- Glow Filters -->
      <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-cyan-subtle" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Background Gradients -->
      <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a101d" />
        <stop offset="50%" stop-color="#070b13" />
        <stop offset="100%" stop-color="#05080f" />
      </linearGradient>

      <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0e1728" />
        <stop offset="100%" stop-color="#080e1a" />
      </linearGradient>

      <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
        <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
      </linearGradient>

      <linearGradient id="accent-cyan-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#ff007f" />
      </linearGradient>
    </defs>
    
  
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
      .cursor-blink { animation: blink 1.1s infinite; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cyber-hover { transition: all 0.3s ease; }
      .cyber-hover:hover { stroke: #00f0ff; stroke-width: 1.5; filter: url(#glow-cyan); }
    </style>
    

  <!-- Main Terminal Frame -->
  <path d="M 1 1 L 885 1 L 899 15 L 899 214 L 1 214 Z" fill="#070b12" stroke="#00f0ff" stroke-width="1.2" />
  <rect x="2" y="2" width="896" height="211" fill="url(#cyber-grid)" />

  <!-- Terminal Chrome Top Bar -->
  
      <!-- Terminal Top Chrome -->
      <path d="M 1 1 L 891 1 L 899 9 L 899 33 L 1 33 Z" fill="#0f192b" stroke="#172b45" stroke-width="1" />
      
      <!-- Traffic lights -->
      <circle cx="17" cy="17" r="4" fill="#ff4d4d" opacity="0.85" />
      <circle cx="29" cy="17" r="4" fill="#ffb830" opacity="0.85" />
      <circle cx="41" cy="17" r="4" fill="#00f0ff" opacity="0.85" />

      <!-- Path / Title -->
      <text x="59" y="21" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="0.5">~/mission</text>
      
      <!-- Right Security/Status Tag -->
      <text x="881" y="21" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" text-anchor="end" letter-spacing="1">// SEC_04: ACTIVE_DIRECTIVES</text>
      
      <!-- Bottom separator line -->
      <line x1="1" y1="33" x2="899" y2="33" stroke="#172b45" stroke-width="1" />
    

  <!-- Terminal Command Line -->
  <g transform="translate(24, 56)">
    
      <text x="0" y="0" fill="#ff007f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">$</text>
      <text x="16" y="0" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="0.5">cat current_objectives.log --watch-threads</text>
      <rect x="354" y="-11" width="7" height="13" fill="#00f0ff" class="cursor-blink" />
    
  </g>

  <!-- Mission Threads List -->
  
        <!-- Thread Item 1 -->
        <g transform="translate(24, 74)">
          <!-- Item Background Bar -->
          <rect x="0" y="0" width="852" height="28" rx="4" fill="#09111f" stroke="#172b45" stroke-width="0.75" />
          <line x1="0" y1="2" x2="0" y2="26" stroke="#00f0ff" stroke-width="3" />

          <!-- Thread Label -->
          <text x="14" y="18" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">[THREAD_01]</text>

          <!-- Objective Description -->
          <text x="120" y="18" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">Build useful software</text>

          <!-- Progress Bar -->
          <rect x="580" y="10" width="140" height="8" rx="2" fill="#142136" />
          <rect x="580" y="10" width="133.0" height="8" rx="2" fill="#00f0ff" />

          <!-- Status Tag -->
          <text x="735" y="18" fill="#c4dbeb" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700">95%</text>
          <text x="840" y="18" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="end">[EXECUTING]</text>
        </g>
        
        <!-- Thread Item 2 -->
        <g transform="translate(24, 107)">
          <!-- Item Background Bar -->
          <rect x="0" y="0" width="852" height="28" rx="4" fill="#09111f" stroke="#172b45" stroke-width="0.75" />
          <line x1="0" y1="2" x2="0" y2="26" stroke="#00ff9f" stroke-width="3" />

          <!-- Thread Label -->
          <text x="14" y="18" fill="#00ff9f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">[THREAD_02]</text>

          <!-- Objective Description -->
          <text x="120" y="18" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">Improve engineering fundamentals</text>

          <!-- Progress Bar -->
          <rect x="580" y="10" width="140" height="8" rx="2" fill="#142136" />
          <rect x="580" y="10" width="119.0" height="8" rx="2" fill="#00ff9f" />

          <!-- Status Tag -->
          <text x="735" y="18" fill="#c4dbeb" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700">85%</text>
          <text x="840" y="18" fill="#00ff9f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="end">[OPTIMIZING]</text>
        </g>
        
        <!-- Thread Item 3 -->
        <g transform="translate(24, 140)">
          <!-- Item Background Bar -->
          <rect x="0" y="0" width="852" height="28" rx="4" fill="#09111f" stroke="#172b45" stroke-width="0.75" />
          <line x1="0" y1="2" x2="0" y2="26" stroke="#ff007f" stroke-width="3" />

          <!-- Thread Label -->
          <text x="14" y="18" fill="#ff007f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">[THREAD_03]</text>

          <!-- Objective Description -->
          <text x="120" y="18" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">Explore scalable systems</text>

          <!-- Progress Bar -->
          <rect x="580" y="10" width="140" height="8" rx="2" fill="#142136" />
          <rect x="580" y="10" width="109.2" height="8" rx="2" fill="#ff007f" />

          <!-- Status Tag -->
          <text x="735" y="18" fill="#c4dbeb" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700">78%</text>
          <text x="840" y="18" fill="#ff007f" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="end">[EXPLORING]</text>
        </g>
        
        <!-- Thread Item 4 -->
        <g transform="translate(24, 173)">
          <!-- Item Background Bar -->
          <rect x="0" y="0" width="852" height="28" rx="4" fill="#09111f" stroke="#172b45" stroke-width="0.75" />
          <line x1="0" y1="2" x2="0" y2="26" stroke="#ffe600" stroke-width="3" />

          <!-- Thread Label -->
          <text x="14" y="18" fill="#ffe600" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700">[THREAD_04]</text>

          <!-- Objective Description -->
          <text x="120" y="18" fill="#e2f1f8" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">Learn by building</text>

          <!-- Progress Bar -->
          <rect x="580" y="10" width="140" height="8" rx="2" fill="#142136" />
          <rect x="580" y="10" width="128.8" height="8" rx="2" fill="#ffe600" />

          <!-- Status Tag -->
          <text x="735" y="18" fill="#c4dbeb" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="700">92%</text>
          <text x="840" y="18" fill="#ffe600" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" text-anchor="end">[BUILDING]</text>
        </g>
        
</svg>