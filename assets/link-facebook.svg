<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 292 108" width="100%" height="108">
  
    <defs>
      <!-- Cyberpunk Grid -->
      <pattern id="cyber-grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.04" />
      </pattern>

      <!-- Finer Grid -->
      <pattern id="cyber-grid-dense" width="12" height="12" patternUnits="userSpaceOnUse">
        <path d="M 12 0 L 0 0 0 12" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.025" />
      </pattern>

      <!-- Diagonal Scanlines -->
      <pattern id="cyber-scanlines" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
        <line x1="0" y1="0" x2="0" y2="6" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.03" />
      </pattern>

      <!-- Glow Filters -->
      <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-cyan-subtle" x="-10%" y="-10%" width="120%" height="120%">
        <feGaussianBlur stdDeviation="1.5" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>

      <!-- Background Gradients -->
      <linearGradient id="bg-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0a101d" />
        <stop offset="50%" stop-color="#070b13" />
        <stop offset="100%" stop-color="#05080f" />
      </linearGradient>

      <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0e1728" />
        <stop offset="100%" stop-color="#080e1a" />
      </linearGradient>

      <linearGradient id="cyan-glow-line" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.1" />
        <stop offset="20%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="80%" stop-color="#00f0ff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.1" />
      </linearGradient>

      <linearGradient id="accent-cyan-magenta" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#00f0ff" />
        <stop offset="100%" stop-color="#ff007f" />
      </linearGradient>
    </defs>
    
  
    <style>
      .mono { font-family: ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace; }
      .cursor-blink { animation: blink 1.1s infinite; }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cyber-hover { transition: all 0.3s ease; }
      .cyber-hover:hover { stroke: #00f0ff; stroke-width: 1.5; filter: url(#glow-cyan); }
    </style>
    

  <!-- Card Background with Chamfered Top-Right Corner -->
  <path d="M 1 1 L 279 1 L 291 13 L 291 107 L 1 107 Z" fill="#0b1220" stroke="#00f0ff" stroke-width="1.5" class="cyber-hover" />
  <rect x="2" y="2" width="288" height="104" fill="url(#cyber-grid)" />

  <!-- Top Accent Highlight -->
  <line x1="2" y1="2" x2="48" y2="2" stroke="#00f0ff" stroke-width="2.5" filter="url(#glow-cyan)" />

  <!-- Small Platform Icon -->
  <g transform="translate(20, 22)">
    <rect x="-4" y="-4" width="34" height="34" rx="4" fill="#080f1c" stroke="#172b45" stroke-width="1" />
    <g transform="translate(1, 1) scale(0.95)">
      <svg width="24" height="24" viewBox="0 0 24 24">
        <path fill="#00f0ff" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
      </svg>
    </g>
  </g>

  <!-- Platform Name (Neon Cyan) -->
  <text x="64" y="34" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="800" letter-spacing="1.5">FACEBOOK</text>
  
  <!-- Secondary Username / Subtext (Muted) -->
  <text x="64" y="52" fill="#c4dbeb" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600">teaman.2606</text>

  <!-- Ping / Status Indicator -->
  <g transform="translate(20, 78)">
    <rect x="0" y="0" width="252" height="20" rx="3" fill="#070c16" stroke="#172b45" stroke-width="0.75" />
    <circle cx="10" cy="10" r="3" fill="#00ff9f" />
    <text x="20" y="14" fill="#607b96" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600">PING: <tspan fill="#00ff9f">12ms</tspan> // <tspan fill="#00f0ff">200 OK</tspan></text>
    <text x="244" y="14" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="end">&gt;&gt; CONNECT</text>
  </g>
</svg>