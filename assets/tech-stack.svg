          <line x1="22" y1="77" x2="62" y2="77" stroke="#00f0ff" stroke-width="2" />
          <text x="36" y="95" fill="#00f0ff" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'Segoe UI Mono', 'Roboto Mono', 'Fira Code', Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="1">// LANGUAGES</text>
          
              <rect x="34" y="107" width="178" height="19" rx="3" fill="#0d1829" stroke="#172b45" stroke-width="0.75" />
